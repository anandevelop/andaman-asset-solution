<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Residence Prime · ผังโครงการ 3 มิติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Embed for andamanassetsolution — matches the site: square corners, navy #083551, sand #e8b384, page #f9f9fa */
:root{
  --page:#f9f9fa; --surface:#ffffff; --line:#e3e6e8; --fg:#0c2433; --muted:#6b7378; --brown:#9c602c;
  --navy:#083551; --sand:#e8b384;
  --st-available:#296682; --st-reserved:#c47b3a; --st-sold:#b6bdc1;
  --scene:#eef1f2; --scene-night:#06131c;
  --font:fcVision,"fcVision Fallback","IBM Plex Sans Thai",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.wrap{height:100%;display:flex;flex-direction:column;gap:12px;padding:12px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips,.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;font-size:13px;cursor:pointer;border-radius:2px;color:var(--fg)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] b{color:#fff}
.tool{border:1px solid var(--line);background:var(--surface);padding:6px 10px;font-size:12px;cursor:pointer;border-radius:2px}
.tool[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;border:1px solid var(--line);background:var(--surface)}
.stage{position:relative;min-height:0;overflow:hidden;background:var(--scene);display:flex;flex-direction:column}
.viewport{position:relative;flex:1;min-height:0}
.viewport canvas{display:block;width:100%;height:100%;touch-action:none}
.stage:fullscreen{width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);font-size:8.5px;font-weight:500;padding:0 4px;border-radius:7px;color:#fff;white-space:nowrap;pointer-events:auto;cursor:pointer;border:1px solid #fff;line-height:1.5;letter-spacing:.01em;background:var(--st-available);font-variant-numeric:tabular-nums;transition:opacity .2s}
.lb[data-st="reserved"]{background:var(--st-reserved)}
.lb[data-st="sold"]{background:var(--st-sold);color:#3b4348}
.lb.dim{opacity:.18 !important}
.lb.sel{outline:2px solid var(--navy);transform:translate(-50%,-100%) scale(1.25);z-index:2}
.poi{position:absolute;transform:translate(-50%,-100%);font-size:10px;font-weight:500;padding:2px 6px;background:rgba(255,255,255,.94);color:var(--fg);border:1px solid var(--line);white-space:nowrap;pointer-events:auto;cursor:pointer;border-radius:2px}
.poi em{font-style:normal;color:var(--brown);margin-right:4px;font-variant-numeric:tabular-nums}
.hidden-labels .lb{display:none}
.compass{position:absolute;left:10px;top:10px;width:34px;height:34px;display:grid;place-items:center;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:50%;font-weight:600;font-size:12px;color:var(--navy)}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.9);padding:3px 8px;border-radius:2px}
.stagebar{position:absolute;inset:0;pointer-events:none}
.legend{position:absolute;right:10px;bottom:10px;display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--muted);border-radius:2px;pointer-events:auto}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ctrls{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.ctrls button{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.96);color:var(--navy);cursor:pointer;border-radius:3px;padding:0}
.ctrls button:hover{background:#fff;border-color:#cfd5d9}
.ctrls button[hidden]{display:none}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.block{padding:16px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
.row span{display:flex;align-items:center;gap:8px}
.row i{width:7px;height:7px;border-radius:50%}
.row b{font-weight:500;font-variant-numeric:tabular-nums;font-size:15px}
.bar{display:flex;height:4px;background:var(--line);margin:10px 0 6px}
.bar span{display:block;height:100%}
.small{font-size:12px;color:var(--muted)}
.detail{flex:1;overflow:auto}
.detail h3{margin:0;font-size:28px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:2px 10px;color:#fff;border-radius:2px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:14px 0 0}
.dl dt{font-size:12px;color:var(--muted)}
.dl dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted);cursor:pointer}
.back:hover{color:var(--navy)}
.pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;margin-top:16px;border:1px solid var(--line);border-radius:2px}
.pager button{display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border:0;background:var(--surface);color:var(--navy);font-size:13px;cursor:pointer}
.pager button:hover{background:var(--page)}
.pager button:first-child{border-right:1px solid var(--line)}
.pager button:last-child{border-left:1px solid var(--line)}
.pager .count{display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cta{padding:16px;border-top:1px solid var(--line)}
.btn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;border:0;padding:12px;font-size:14px;cursor:pointer;text-decoration:none;border-radius:2px}
.btn:hover{background:#0b4468}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);margin-top:8px}
@media (max-width:760px){
  .wrap{padding:8px;gap:8px}
  .main{display:flex;flex-direction:column}
  .stage{flex:1;min-height:260px}
  .side{flex:0 0 auto;border-left:0;border-top:1px solid var(--line);max-height:44vh}
  .detail{min-height:0}
  .block{padding:12px}
  .cta{padding:10px 12px}
  .detail h3{font-size:22px}
  .chip,.tool{padding:5px 9px}
  .side .stats{display:none}
  .hint{display:none}
  .stagebar{position:static;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line)}
  .legend{position:static;background:none;border:0;padding:0;gap:4px 10px;flex-wrap:wrap;min-width:0}
  .ctrls{position:static;flex-direction:row;flex-shrink:0;gap:0;border:1px solid var(--line);border-radius:3px}
  .ctrls button{border:0;border-left:1px solid var(--line);border-radius:0;width:40px;height:38px}
  .ctrls button:first-child{border-left:0}
}
@media (prefers-reduced-motion: reduce){.lb{transition:none}}
</style>

(function(){
  const NR = rng(2024);
  const noise3=(x,y,z)=>Math.sin(x*3.1+y*1.7)*Math.cos(z*2.3-x*1.1)+0.5*Math.sin(y*5.3+z*4.1);

    for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const d=1+0.18*noise3(v.x*2.5+seed,v.y*2.5-seed,v.z*2.5+seed*0.7);
      p.setXYZ(i, cx+v.x*rx*d, cy+v.y*ry*d*(v.y<0?0.7:1), cz+v.z*rz*d); }
    g.computeVertexNormals(); return g;
  }
  // clumps scattered over an ellipsoid canopy (more clumps toward the sunlit top)
  function clumps(n, R, Hc, yc, flat, size){
    const out=[]; for(let i=0;i<n;i++){
      const th=NR()*Math.PI*2, u=Math.pow(NR(),0.6), ph=Math.acos(1-u*(flat?1.2:1.6));
      const x=Math.sin(ph)*Math.cos(th)*R, z=Math.sin(ph)*Math.sin(th)*R, y=yc+Math.cos(ph)*Hc;
      const s=size*(0.75+NR()*0.5); out.push([x,y,z,s,s*(flat?0.6:0.85),s]);

  }
  function canopy(blobs, top, bottom, hue){

    const g=THREE.BufferGeometryUtils.mergeBufferGeometries(parts);
    const p=g.attributes.position, n=g.attributes.normal, cols=new Float32Array(p.count*3), c=new THREE.Color();
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i), z=p.getZ(i), k=Math.max(0,Math.min(1,(y-bottom)/(top-bottom)));
      const rim=Math.min(1,Math.hypot(x,z)/0.5), ny=n.getY(i);

    const list=units.filter(x=>filter==="all"||x.status===filter), pos=list.findIndex(x=>x.k===selected);
    el.innerHTML = `<div class="dhead"><p class="eyebrow" style="margin:0">${T.plot}</p><button class="back" id="u-back"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>${T.back}</button></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>${u.id}</h3><span class="pill" style="background:var(${STC[u.status]});${u.status==="sold"?"color:#3b4348":""}">${T[u.status]}</span></div>
      <dl class="dl">
        <div><dt>${T.land}</dt><dd>${u.land} ${T.sqm}</dd></div>
        <div><dt>${T.usable}</dt><dd>${houseOf(u).area} ${T.sqm}</dd></div>
        <div><dt>${T.type}</dt><dd>${houseOf(u).type}</dd></div>
        <div><dt>${T.beds}</dt><dd>${houseOf(u).beds} / ${houseOf(u).baths}</dd></div>
        <div><dt>${T.floors}</dt><dd>${houseOf(u).floors}</dd></div>
        <div><dt>${T.facing}</dt><dd>${dirName(u.g.f)}</dd></div>
      </dl>
      <div class="pager"><button id="u-prev" aria-label="${T.prev}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>${T.prev}</span></button><span class="count">${pos>=0?pos+1:"–"} / ${list.length}</span><button id="u-next" aria-label="${T.next}"><span>${T.next}</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button></div>`;
    const step=d=>{ const list=units.filter(x=>filter==="all"||x.status===filter); if(!list.length)return; const i=list.findIndex(x=>x.k===selected); select(list[(i+d+list.length)%list.length].k); };
    $("u-prev").onclick=()=>step(-1); $("u-next").onclick=()=>step(1);
    $("u-back").onclick=()=>{selected=null; flyTo(HOME.pos.clone(),HOME.tgt.clone()); refresh();};
    cta.textContent = u.status==="sold" ? T.cta : T.ctaUnit(u.id);
  }
  cta.href = ENQUIRE;
  cta.onclick = e=>{ if(window.parent!==window){ e.preventDefault(); post({type:"rp3d:enquire", unit:u?u.id:null}); } };
}
function select(k){ selected=k; const u=units.find(x=>x.k===k); if(u){ focusUnit(u); post({type:"rp3d:select", unit:u.id, status:u.status, land:u.land}); } refresh(); }
function refresh(){ paint(); chips(); stats(); detail(); }

/* live data: optional JSON URL, and updates pushed from the parent page */
function applyData(list){
  if(!Array.isArray(list)) return;
  list.forEach(d=>{ const nid=s=>String(s||"").toUpperCase().replace(/^([A-Z]+)0*/,"$1"); const id=nid(d.id); const u=units.find(x=>nid(x.id)===id); if(!u) return;
    if(ST.includes(d.status)) u.status=d.status; if(+d.land>0) u.land=+d.land; });
  refresh();
}
window.addEventListener("message",e=>{ if(e.origin!==location.origin && location.protocol!=="file:") return; const m=e.data; if(m && m.type==="rp3d:setUnits") applyData(m.units); });
if(Q.get("data") && new URL(Q.get("data"), location.href).origin === location.origin) fetch(Q.get("data"),{credentials:"same-origin"}).then(r=>r.json()).then(applyData).catch(()=>{});

/* text for tools */
$("t-day").textContent=T.day; $("t-night").textContent=T.night; $("t-labels").textContent=T.labels; $("t-reset").textContent=T.reset; $("hint").textContent=T.hint;
$("t-day").onclick=()=>{night=false;applyLight()}; $("t-night").onclick=()=>{night=true;applyLight()};
$("t-labels").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);stage.classList.toggle("hidden-labels",!on)};
$("t-reset").onclick=()=>{selected=null;flyTo(HOME.pos.clone(),HOME.tgt.clone());refresh()};
const zoomBy=f=>{ const d=camera.position.clone().sub(controls.target).multiplyScalar(f); const len=d.length(); if(len<controls.minDistance||len>controls.maxDistance) return; flyTo(controls.target.clone().add(d), controls.target.clone()); };
{ const hb=$("z-home"); hb.title=T.reset; hb.setAttribute("aria-label",T.reset); hb.onclick=()=>{selected=null;flyTo(HOME.pos.clone(),HOME.tgt.clone());refresh()};
  $("z-in").title=$("z-in").ariaLabel=T.zin; $("z-out").title=$("z-out").ariaLabel=T.zout;
  const fb=$("z-full"), st=$("stage"), canFS=!!(st.requestFullscreen||st.webkitRequestFullscreen) && (document.fullscreenEnabled||document.webkitFullscreenEnabled);
  if(!canFS) fb.hidden=true;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const sync=()=>{ const on=!!fsEl(); fb.innerHTML=on?fb.dataset.on:fb.dataset.off; fb.title=on?T.fsOff:T.fsOn; fb.setAttribute("aria-label",fb.title); };
  fb.onclick=()=>{ if(fsEl()) (document.exitFullscreen||document.webkitExitFullscreen).call(document); else (st.requestFullscreen||st.webkitRequestFullscreen).call(st); };
  document.addEventListener("fullscreenchange",sync); document.addEventListener("webkitfullscreenchange",sync); sync(); }
$("z-in").onclick=()=>zoomBy(0.75); $("z-out").onclick=()=>zoomBy(1.33);
/* ---------- scene theme / day-night ---------- */
function applyLight(){
  const bg = new THREE.Color(night?css("--scene-night"):css("--scene"));
  scene.background = bg; scene.fog = new THREE.Fog(bg, 220, 520);
  base.material.color.set(night?0x1b2630:0xf8f8f8);
  hemi.intensity = night?0.16:0.75; sun.intensity = night?0.06:0.9;
  sun.color.set(night?0x9fb6ff:0xfff3df);
  ground.material.color.set(night?0x6d7a86:0xffffff);
  lampHeads.forEach(h=>h.material.color.set(night?0xffe0a0:0x8a949b));
  nightLights.forEach(l=>l.intensity = night?1.4:0);
  $("t-day").setAttribute("aria-pressed",!night); $("t-night").setAttribute("aria-pressed",night);
  paint();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyLight);
new MutationObserver(applyLight).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown",e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener("pointerup",e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5)return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse,camera);
  const hit = ray.intersectObjects(pick,false)[0];
  if(hit) select(hit.object.userData.k,false);
});

/* ---------- camera flight ---------- */
let fly = null;
function flyTo(pos,tgt){ fly = {t:0, p0:camera.position.clone(), t0:controls.target.clone(), p1:pos, t1:tgt}; }
function focusUnit(u){
  const g=u.mesh.grp.position; const f=new THREE.Vector3(u.g.f[0],0,u.g.f[1]).normalize();
  const k=Math.max(1,(u.dp||12)/14); flyTo(g.clone().add(f.multiplyScalar(32*k)).add(new THREE.Vector3(8*k,26*k,8*k)), g.clone().setY(3));
}

/* ---------- loop ---------- */
function resize(){ const r=$("viewport").getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe($("viewport"));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let pt=0, dir=1, last=performance.now();
const v=new THREE.Vector3();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(fly){ fly.t=Math.min(1,fly.t+dt*(reduce?10:1.4)); const e=1-Math.pow(1-fly.t,3); camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(fly.t>=1)fly=null; }
  controls.update();
  // patrol
  pt += dir*dt*0.018; if(pt>1){pt=1;dir=-1} if(pt<0){pt=0;dir=1}
  const p=curve.getPointAt(pt), tg=curve.getTangentAt(pt).multiplyScalar(dir);
  const off=new THREE.Vector3(-tg.z,0,tg.x).multiplyScalar(1.3);
  patrol.position.copy(p).add(off); patrol.rotation.y=Math.atan2(tg.x,tg.z);
  walkPeople(dt,now);
  beacon.material.color.set(Math.floor(now/400)%2?0xff5a3c:0x3c7bff);
  renderer.render(scene,camera);
  // labels
  const r=renderer.domElement.clientWidth, h=renderer.domElement.clientHeight;
  const dist=camera.position.distanceTo(controls.target);
  for(const l of lbs){
    v.copy(l.v).project(camera);
    if(v.z>1||v.x<-1.1||v.x>1.1||v.y<-1.1||v.y>1.1){l.el.style.display="none";continue}
    l.el.style.display=""; l.el.style.left=((v.x+1)/2*r)+"px"; l.el.style.top=((1-v.y)/2*h)+"px";
    if(!l.poi) l.el.style.opacity = dist>230?0:1;
  }
  const az = controls.getAzimuthalAngle(); $("needle").style.transform=`rotate(${az*180/Math.PI}deg)`;
  requestAnimationFrame(tick);
}

resize(); applyLight(); refresh();
requestAnimationFrame(tick);
</script>
</body>
