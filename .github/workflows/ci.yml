name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same branch cancels the in-flight run. Nobody needs the
# result of a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ── Schema ────────────────────────────────────────────────────────────
  # Its own job because it needs neither a database nor a full install, so
  # a broken schema fails in seconds rather than after a four-minute build.
  prisma:
    name: Prisma schema
    runs-on: ubuntu-latest
    env:
      # `prisma validate` parses the datasource block before it validates
      # anything, so env("DATABASE_URL") has to resolve or the whole schema
      # is rejected with P1012 — which is what this job did on every run.
      # Nothing connects here; the value only has to be a well-formed URL.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema
        run: npx prisma validate

      - name: Check schema formatting
        # --check fails rather than rewriting, so an unformatted schema
        # cannot land on main.
        run: npx prisma format --check

  # ── Static analysis ───────────────────────────────────────────────────
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client is generated code — tsc cannot resolve @prisma/client
      # types without it.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ── Tests ─────────────────────────────────────────────────────────────
  # Separate job so a sanitizer regression is reported by name rather than
  # buried in a combined "quality" failure. Translation parity, nav/sitemap
  # coverage and the XSS suite all live in tests/.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        # Retained even on failure: the coverage report is often how you
        # work out which branch the failing test was meant to reach.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── End-to-end ────────────────────────────────────────────────────────
  # A real Postgres, a production build and a real browser. Slower than
  # everything above put together, which is why it is one job rather than
  # a matrix — and why the fast checks are not blocked behind it.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [prisma, quality]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: andaman_e2e
        ports:
          - 5432:5432
        # Without the health check the first migration races the server's
        # own startup and fails on connection refused.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DATABASE_URL: postgresql://e2e:e2e@localhost:5432/andaman_e2e?schema=public
      # Distinct from E2E_DATABASE_URL, or global-setup refuses to run —
      # it will not wipe a database that might be someone's development
      # copy. Nothing reads this one.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused?schema=public
      # 32 characters minimum — lib/env.ts refuses to start the server on a
      # shorter one, and the e2e job runs `next start`, i.e. NODE_ENV=production.
      NEXTAUTH_SECRET: e2e-ci-placeholder-secret-000000000000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_DEFAULT_LOCALE: th
      # Tells global-setup.ts that the step below already did the work, so
      # it does not truncate the fixtures the production build was just
      # prerendered from. See the note on its default export.
      E2E_DB_ALREADY_PREPARED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Chromium only. Firefox and WebKit triple the download and catch
      # nothing these journeys depend on; add them when a cross-browser
      # bug actually shows up.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Before Playwright, not inside it. Playwright starts `webServer`
      # ahead of globalSetup, and in CI that server command is
      # `npm run build && next start` — a build that reads the database.
      # Seeding afterwards would leave the home page and the project list
      # prerendered from an empty database, held that way by their
      # one-hour revalidate for the whole run.
      - name: Seed the e2e database
        run: npm run test:e2e:db

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure traces
        # Only written when a test fails. A trace opens in
        # `npx playwright show-trace` and replays the run frame by frame,
        # which beats guessing from a screenshot.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ── Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [prisma, quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        env:
          # Placeholder: nothing is queried at build time — data pages are
          # force-dynamic or wrapped in safeQuery — but Prisma Client's
          # constructor still wants a parseable URL.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          NEXTAUTH_SECRET: ci-build-placeholder-secret
          NEXT_PUBLIC_SITE_URL: https://andamanassetsolution.com
          NEXT_PUBLIC_DEFAULT_LOCALE: th
        run: npm run build

      - name: Report bundle size
        # Not a gate — just a number in the log, so a dependency that adds
        # two megabytes is visible in the PR that added it.
        run: |
          echo "### Build output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh .next .next/static .next/standalone 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Container ─────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build]
    # Only on push: a PR does not need the image, and this is the slowest job.
    if: github.event_name == 'push'
    permissions:
      contents: read
      # Needed by the GHCR push below; GITHUB_TOKEN is read-only otherwise.
      packages: write
    env:
      # Every NEXT_PUBLIC_* the Dockerfile declares an ARG for and that has
      # a real value. These are inlined into the client bundle at build
      # time, so they are public by construction — the reCAPTCHA *site* key
      # is rendered into the page, unlike RECAPTCHA_SECRET_KEY — and none of
      # them can be supplied at runtime. Changing one means a new image.
      #
      # Held on the job so the smoke-test build and the published build
      # cannot drift apart; an image that passes the smoke test with
      # different arguments than the one that ships proves nothing.
      #
      # GA_ID and META_PIXEL_ID are deliberately absent: both are unset, and
      # the pixel is read from site settings at request time anyway.
      IMAGE_BUILD_ARGS: |
        NEXT_PUBLIC_SITE_URL=https://andamanassetsolution.com
        NEXT_PUBLIC_DEFAULT_LOCALE=th
        NEXT_PUBLIC_MEDIA_DOMAIN=andamanasset-media.sgp1.cdn.digitaloceanspaces.com
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6LdkEaEtAAAAAOUwQsQOWAw-EwR-6KYjJ9WmMXEd
        NEXT_PUBLIC_LINE_ADD_FRIEND_URL=https://line.me/R/ti/p/@andamanasset

    # A real database for the smoke test below. Without one the test could
    # only ask "did it answer at all", and a container whose Prisma engine
    # will not load answers exactly the same way as one with no database
    # configured — see the note on that step.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # The deploy target is an amd64 VPS. Pinned rather than left to
          # the runner so a future arm64 runner cannot silently ship an
          # image the server cannot execute.
          platforms: linux/amd64
          tags: andaman-asset-solution:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ env.IMAGE_BUILD_ARGS }}

      - name: Smoke test the image
        # Proves the container starts, reaches Postgres and can query it.
        #
        # It used to accept 200 *or* 503, on the reasoning that 503 is the
        # correct answer with no database attached. True — and the reason
        # this test passed an image whose Prisma query engine could not
        # load at all. The Dockerfile did not install openssl, so
        # `prisma generate` could not detect the system version, defaulted
        # to openssl-1.1.x, and shipped an engine Alpine 3.24 has no
        # libssl.so.1.1 for. Every query in that container failed. The site
        # still started and still served pages, because lib/db.ts degrades
        # to empty states rather than crashing, and /api/health answered
        # 503 — indistinguishable from "no database configured".
        #
        # So the assertion is now 200 and `database.ok`, which requires a
        # database that really answers. The service above provides it.
        env:
          SMOKE_DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke?schema=public
        run: |
          # Migrations first, from the image itself — this doubles as proof
          # that the documented `prisma migrate deploy` release step works
          # from the published artefact.
          docker run --rm --network host \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            --entrypoint node andaman-asset-solution:${{ github.sha }} \
            node_modules/prisma/build/index.js migrate deploy

          # The container validates its environment at startup and exits
          # non-zero on anything missing (lib/env.ts), so the smoke test has
          # to hand it a complete one — a 32-character secret included.
          # NEXT_PUBLIC_SITE_URL is not passed here: it is baked in by
          # IMAGE_BUILD_ARGS above, which is exactly what this proves.
          #
          # --network host so the container reaches the service on
          # localhost:5432, the same address the runner sees it at.
          docker run -d --name smoke --network host --init \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e NEXTAUTH_SECRET="ci-smoke-placeholder-secret-0000000000" \
            -e NEXTAUTH_URL="https://andamanassetsolution.com" \
            andaman-asset-solution:${{ github.sha }}

          for i in $(seq 1 30); do
            body=$(curl -s http://localhost:3000/api/health || true)
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)

            if [ "$code" = "200" ] && echo "$body" | grep -q '"ok":true'; then
              echo "✓ container answered 200 and queried the database"
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done

          echo "✗ container never reported a healthy database"
          echo "  last status: ${code:-none}"
          echo "  last body:   ${body:-none}"
          docker logs smoke
          docker rm -f smoke
          exit 1

      # ── Publish ───────────────────────────────────────────────────────
      # Only from main, and only after the smoke test above: a tag that
      # cannot start is worse than no tag, because docker-compose.prod.yml
      # pulls :latest on every deploy.
      #
      # A second build-push-action call rather than one that both loads and
      # pushes — buildx cannot do both in a single invocation. It is a cache
      # hit on everything the step above built, so it costs a layer upload,
      # not a rebuild.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # :latest is what the compose file pulls; the sha tag is what
          # makes a rollback possible once :latest has moved on.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
