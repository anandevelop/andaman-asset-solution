name: Deploy

# Runs after CI finishes on main, not on push directly — `docker
# compose pull` below only makes sense once the `docker` job in
# ci.yml has actually pushed a new :latest image to GHCR, and that job
# itself only runs after the build and its smoke test pass. Triggering
# on push instead would race CI's own image push, sometimes deploying
# before the new image exists yet.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# One deploy at a time, queued rather than cancelled — an in-flight
# `docker compose up -d` is not something to interrupt.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Only when CI's full run (lint, tests, e2e, build, docker) actually
    # succeeded — a red CI run should never reach the server.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          # The commit CI just built and pushed as :latest.
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          # Stop at the first failing command. Without this the step was
          # green whatever happened on the server: on 2026-10-03 the run for
          # b6f741c "succeeded" while the old container kept serving
          # e6552c9, because a failed pull went unnoticed.
          script_stop: true
          envs: EXPECTED_COMMIT
          script: |
            set -eu
            cd /opt/app

            # Make room first. Every deploy pulls a new ~1 GB image and
            # nothing ever removed the old ones, until on 2026-10-03 the
            # pull failed with "no space left on device". `image prune -a`
            # only removes images no container uses — the running app and
            # postgres keep theirs — and the build cache goes too. Volumes
            # are never touched: the database lives in one.
            docker image prune -af
            docker builder prune -af || true
            df -h / | tail -1

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Wait (up to ~90s) for the app to answer AS THE NEW BUILD:
            # /api/health reports the commit it was built from, so a
            # container that never restarted is caught here, not by a
            # person noticing the site has not changed.
            LIVE=""
            for i in $(seq 1 45); do
              LIVE=$(curl -fsS http://127.0.0.1/api/health 2>/dev/null | grep -o '"commit":"[0-9a-f]*"' | cut -d'"' -f4 || true)
              [ "$LIVE" = "$EXPECTED_COMMIT" ] && break
              sleep 2
            done
            if [ "$LIVE" != "$EXPECTED_COMMIT" ]; then
              echo "::error::server is running '${LIVE:-nothing}', expected $EXPECTED_COMMIT"
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi
            echo "live: $LIVE"

            # Belt and braces on top of not prerendering at build time: purge
            # the ISR cache of every public page in every locale, plus the
            # site-settings tag. Any failure here only warns — a good deploy
            # must never turn red because the purge did.
            SECRET=$(grep -E '^REVALIDATE_SECRET=' .env | cut -d= -f2- | tr -d '"')
            if [ -n "$SECRET" ]; then
              curl -fsS -X POST http://127.0.0.1/api/revalidate \
                -H "Content-Type: application/json" \
                -H "x-revalidate-secret: $SECRET" \
                -d '{"paths":["/","/projects","/news","/events","/about","/achievements","/e-brochure","/contact","/progress"],"tags":["site-settings"]}' \
                || echo "::warning::post-deploy revalidate failed"
            else
              echo "::warning::REVALIDATE_SECRET not set on server — skipped cache purge"
            fi
