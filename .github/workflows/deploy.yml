name: Deploy

# Called by ci.yml's `deploy` job on main, once the image is smoke-tested
# and the schema, lint, typecheck and unit tests pass (the end-to-end
# shards run alongside and do not hold it up). Also runnable by hand from
# the Actions tab, to redeploy a given commit's image — a rollback is the
# sha of the last good commit.
on:
  workflow_call:
    inputs:
      commit:
        description: The commit whose image to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit:
        description: Commit sha whose image (ghcr :<sha>) to deploy
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # One deploy at a time, queued rather than cancelled — an in-flight
    # `docker compose up -d` is not something to interrupt. On the job, so
    # it holds for both the call from CI and a run by hand.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      # :latest is what docker-compose.prod.yml pulls. It moves here, not
      # in the docker job, so it only ever names an image whose commit
      # passed every gate this deploy waited for. Retagging copies a
      # manifest — nothing is rebuilt or re-uploaded.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Point :latest at this commit's image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ inputs.commit }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          # The commit whose image :latest now names.
          EXPECTED_COMMIT: ${{ inputs.commit }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: EXPECTED_COMMIT
          # `set -eu` is what stops the script at the first failing command.
          # Without it the step was green whatever happened on the server: on
          # 2026-10-03 the run for b6f741c "succeeded" while the old container
          # kept serving e6552c9, because a failed pull went unnoticed.
          #
          # Not `script_stop: true`, which was tried alongside it and failed
          # every deploy since. It appends an "exit if $? is non-zero" check
          # after *every line*, blind to shell syntax, so the wait loop's
          # `[ "$LIVE" = "$EXPECTED_COMMIT" ] && break` — false on the first
          # pass, by design — ended the script with exit 1 and no message.
          # `set -e` understands that a failed test inside `&&` is not an error.
          script: |
            set -eu
            cd /opt/app

            # Make room first. Every deploy pulls a new ~1 GB image and
            # nothing ever removed the old ones, until on 2026-10-03 the
            # pull failed with "no space left on device". `image prune -a`
            # only removes images no container uses — the running app and
            # postgres keep theirs — and the build cache goes too. Volumes
            # are never touched: the database lives in one.
            docker image prune -af
            docker builder prune -af || true
            df -h / | tail -1

            COMPOSE="docker compose -f docker-compose.prod.yml"
            $COMPOSE pull
            $COMPOSE up -d

            # Both requests below are made from inside the app container, to
            # the server's own port. They used to go to http://127.0.0.1 on
            # the host, which on the real server is Caddy, not the app — the
            # server's compose file has a TLS proxy the one in this repo does
            # not — and Caddy, routing by hostname, gave a bare IP nothing.
            # The a96efd4 deploy failed that way with the new container up
            # and healthy. Asking the container directly works whatever sits
            # in front of it. The image is node:alpine: node is there, curl
            # is not.
            in_app() { $COMPOSE exec -T app node -e "$1"; }

            # Wait (up to ~90s) for the app to answer AS THE NEW BUILD:
            # /api/health reports the commit it was built from, so a
            # container that never restarted is caught here, not by a
            # person noticing the site has not changed.
            LIVE=""
            for i in $(seq 1 45); do
              LIVE=$(in_app "fetch('http://127.0.0.1:3000/api/health').then(r => r.json()).then(j => console.log(j.commit || ''), () => {})" 2>/dev/null || true)
              [ "$LIVE" = "$EXPECTED_COMMIT" ] && break
              sleep 2
            done
            if [ "$LIVE" != "$EXPECTED_COMMIT" ]; then
              # ssh-action prefixes every line with "out: ", so GitHub never
              # turns this into an annotation — it is for the log reader.
              echo "::error::server is running '${LIVE:-nothing}', expected $EXPECTED_COMMIT"
              $COMPOSE ps
              $COMPOSE logs --tail=40 app || true
              exit 1
            fi
            echo "live: $LIVE"

            # Belt and braces on top of not prerendering at build time: purge
            # the ISR cache of every public page in every locale, plus the
            # site-settings tag. REVALIDATE_SECRET comes from the container's
            # own environment, the same value the route checks. Any failure
            # here only warns — a good deploy must never turn red because the
            # purge did.
            in_app "
              const secret = process.env.REVALIDATE_SECRET;
              if (!secret) { console.log('::warning::REVALIDATE_SECRET not set on server — skipped cache purge'); process.exit(0); }
              fetch('http://127.0.0.1:3000/api/revalidate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-revalidate-secret': secret },
                body: JSON.stringify({
                  paths: ['/', '/projects', '/news', '/events', '/about', '/achievements', '/e-brochure', '/contact', '/progress'],
                  tags: ['site-settings'],
                }),
              }).then(r => console.log('revalidate:', r.status));
            " || echo "::warning::post-deploy revalidate failed"

            # ── Host upkeep ──────────────────────────────────────────────
            # The nightly database backup runs on this host, not in a
            # container (scripts/backup-db.sh). Every deploy refreshes the
            # script from the image just deployed, installs its crontab line
            # if it is missing, and takes a backup now when there is none
            # from the last day — so a fresh or rebuilt droplet is never a
            # night without one. All of it only warns: a good deploy never
            # turns red over upkeep. The back office shows the outcome
            # (/admin/settings/system, lib/backup-status.ts).
            BACKUP_LINE="30 19 * * * /opt/app/backup-db.sh >> /opt/app/backups/backup.log 2>&1"
            mkdir -p /opt/app/backups && chmod 700 /opt/app/backups || true
            if $COMPOSE exec -T app cat scripts/ops/backup-db.sh > /opt/app/backup-db.sh.new \
                && [ -s /opt/app/backup-db.sh.new ]; then
              mv /opt/app/backup-db.sh.new /opt/app/backup-db.sh && chmod 700 /opt/app/backup-db.sh
            else
              rm -f /opt/app/backup-db.sh.new
              echo "::warning::could not refresh backup-db.sh from the image"
            fi
            if ! crontab -l 2>/dev/null | grep -qF "/opt/app/backup-db.sh"; then
              ( crontab -l 2>/dev/null; echo "$BACKUP_LINE" ) | crontab - \
                && echo "installed the nightly backup (02:30 Bangkok) in crontab" \
                || echo "::warning::could not install the backup crontab line"
            fi
            if [ -x /opt/app/backup-db.sh ] && \
               [ -z "$(find /opt/app/backups -name 'andaman-*.dump' -mtime -1 2>/dev/null | head -n 1)" ]; then
              echo "no backup from the last day — taking one now"
              if /opt/app/backup-db.sh >> /opt/app/backups/backup.log 2>&1; then
                tail -n 2 /opt/app/backups/backup.log
              else
                echo "::warning::backup failed — see /opt/app/backups/backup.log"
                tail -n 5 /opt/app/backups/backup.log || true
              fi
            fi
            if ! grep -q '"max-size"' /etc/docker/daemon.json 2>/dev/null; then
              echo "::warning::Docker log limits are not set on this host. Run scripts/server-setup.sh once, as root (see its header)."
            fi
            df -h / | tail -n 1
