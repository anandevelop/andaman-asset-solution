version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: andaman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andaman_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-andaman_asset_solution}
    ports:
      - "5432:5432"
    volumes:
      - andaman_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-andaman_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: lightweight DB admin UI for local development
  adminer:
    image: adminer:latest
    container_name: andaman_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  andaman_pg_data:
    driver: local
